name: Publish core

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-core-${{ github.ref }}
  cancel-in-progress: false

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      should-release: ${{ steps.plan.outputs.should-release }}
      release-sha: ${{ steps.plan.outputs.release-sha }}
      package-name: ${{ steps.plan.outputs.package-name }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - id: plan
        env:
          BEFORE_SHA: ${{ github.event.before }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          before_sha="$BEFORE_SHA"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            before_sha="$(git rev-parse "$RELEASE_SHA^1")"
          fi
          bun scripts/release-plan.ts core "$before_sha" "$RELEASE_SHA"

  artifact:
    needs: classify
    if: needs.classify.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 2
          persist-credentials: false
          ref: ${{ needs.classify.outputs.release-sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Revalidate the exact release transition
        env:
          RELEASE_SHA: ${{ needs.classify.outputs.release-sha }}
        run: |
          set -euo pipefail
          parent_sha="$(git rev-parse "$RELEASE_SHA^1")"
          bun scripts/release-plan.ts core "$parent_sha" "$RELEASE_SHA" /tmp/core-release-plan
      - run: bun run core:build
      - name: Build and verify the one publish candidate
        run: bun scripts/verify-core-package.ts dist/core-package
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: llm-now-core-${{ needs.classify.outputs.release-sha }}
          path: |
            dist/core-package/*.tgz
            dist/core-package/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [classify, artifact]
    if: needs.classify.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    environment: npm-core-publish
    outputs:
      package: ${{ steps.registry.outputs.package }}
      version: ${{ steps.registry.outputs.version }}
      integrity: ${{ steps.registry.outputs.integrity }}
      new-candidate: ${{ steps.registry.outputs.publish }}
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify npm trusted publishing toolchain
        run: |
          NODE_VERSION="$(node -p 'process.versions.node')" NPM_VERSION="$(npm --version)" node -e '
            const atLeast = (actual, floor) => { const parts = actual.split(".").map(Number); const difference = floor.findIndex((part, index) => parts[index] !== part); return difference === -1 || parts[difference] > floor[difference]; };
            if (!atLeast(process.env.NODE_VERSION, [22, 14, 0])) throw new Error("Node 22.14 or later is required");
            if (!atLeast(process.env.NPM_VERSION, [11, 5, 1])) throw new Error("npm 11.5.1 or later is required");
          '
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: llm-now-core-${{ needs.classify.outputs.release-sha }}
          path: dist/core-package
      - name: Re-verify the recorded artifact digest
        working-directory: dist/core-package
        run: sha256sum -c SHA256SUMS
      - name: Inspect preserved artifact and registry state
        id: registry
        env:
          EXPECTED_PACKAGE: ${{ needs.classify.outputs.package-name }}
          EXPECTED_VERSION: ${{ needs.classify.outputs.version }}
        run: |
          set -euo pipefail
          mapfile -t tarballs < <(find dist/core-package -maxdepth 1 -type f -name '*.tgz' -print)
          test "${#tarballs[@]}" -eq 1
          tarball="${tarballs[0]}"
          manifest="$(tar -xOf "$tarball" package/package.json)"
          package="$(jq -r .name <<<"$manifest")"
          version="$(jq -r .version <<<"$manifest")"
          test "$package" = "$EXPECTED_PACKAGE"
          test "$version" = "$EXPECTED_VERSION"
          integrity="sha512-$(openssl dgst -sha512 -binary "$tarball" | openssl base64 -A)"
          error_file="$(mktemp)"
          if registry="$(npm view "$package@$version" --json 2>"$error_file")"; then
            registry_name="$(jq -r .name <<<"$registry")"
            registry_version="$(jq -r .version <<<"$registry")"
            registry_integrity="$(jq -r .dist.integrity <<<"$registry")"
            registry_provenance="$(jq -r '.dist.attestations.provenance.predicateType // empty' <<<"$registry")"
            next="$(npm view "$package" dist-tags.next --json | jq -r '. // empty')"
            if [ "$registry_name" != "$package" ] || [ "$registry_version" != "$version" ] || [ "$registry_integrity" != "$integrity" ] || [ "$next" != "$version" ]; then
              echo "existing registry version does not match preserved artifact" >&2
              exit 1
            fi
            test -n "$registry_provenance" || { echo "registry provenance is absent" >&2; exit 1; }
            publish=false
          elif grep -q 'E404' "$error_file"; then
            publish=true
          else
            cat "$error_file" >&2
            exit 1
          fi
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "package=$package" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "integrity=$integrity" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
      - name: Publish preserved artifact under next
        if: steps.registry.outputs.publish == 'true'
        env:
          TARBALL: ${{ steps.registry.outputs.tarball }}
          NPM_BOOTSTRAP_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "$NPM_BOOTSTRAP_TOKEN" ]; then
            NODE_AUTH_TOKEN="$NPM_BOOTSTRAP_TOKEN" npm publish "$TARBALL" --access public --tag next --provenance
          else
            npm publish "$TARBALL" --access public --tag next --provenance
          fi
      - name: Verify candidate under next
        env:
          PACKAGE: ${{ steps.registry.outputs.package }}
          VERSION: ${{ steps.registry.outputs.version }}
          EXPECTED_INTEGRITY: ${{ steps.registry.outputs.integrity }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if registry="$(npm view "$PACKAGE@$VERSION" --json 2>/dev/null)"; then
              integrity="$(jq -r .dist.integrity <<<"$registry")"
              provenance="$(jq -r '.dist.attestations.provenance.predicateType // empty' <<<"$registry")"
              next="$(npm view "$PACKAGE" dist-tags.next --json | jq -r '. // empty')"
              if [ "$integrity" = "$EXPECTED_INTEGRITY" ] && [ -n "$provenance" ] && [ "$next" = "$VERSION" ]; then
                exit 0
              fi
            fi
            sleep 5
          done
          echo "candidate is not verifiably available under next" >&2
          exit 1

  registry-smoke:
    needs: [classify, artifact, publish]
    if: needs.classify.outputs.should-release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ needs.classify.outputs.release-sha }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify npm trusted publishing toolchain
        run: |
          NODE_VERSION="$(node -p 'process.versions.node')" NPM_VERSION="$(npm --version)" node -e '
            const atLeast = (actual, floor) => { const parts = actual.split(".").map(Number); const difference = floor.findIndex((part, index) => parts[index] !== part); return difference === -1 || parts[difference] > floor[difference]; };
            if (!atLeast(process.env.NODE_VERSION, [22, 14, 0])) throw new Error("Node 22.14 or later is required");
            if (!atLeast(process.env.NPM_VERSION, [11, 5, 1])) throw new Error("npm 11.5.1 or later is required");
          '
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: llm-now-core-${{ needs.classify.outputs.release-sha }}
          path: dist/core-package
      - name: Cold-install and execute the exact registry version
        env:
          PACKAGE: ${{ needs.publish.outputs.package }}
          VERSION: ${{ needs.publish.outputs.version }}
          EXPECTED_INTEGRITY: ${{ needs.publish.outputs.integrity }}
        run: |
          set -euo pipefail
          sha256sum -c dist/core-package/SHA256SUMS
          tarball="$(find dist/core-package -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          test -n "$tarball"
          cold="$(mktemp -d)"
          fetched=""
          for attempt in 1 2 3 4 5; do
            if npm pack "$PACKAGE@$VERSION" --ignore-scripts --pack-destination "$cold" --cache "$cold/npm-pack-cache" >/dev/null; then
              fetched="$(find "$cold" -maxdepth 1 -type f -name '*.tgz' -print -quit)"
              break
            fi
            sleep 5
          done
          test -n "$fetched"
          fetched_integrity="sha512-$(openssl dgst -sha512 -binary "$fetched" | openssl base64 -A)"
          test "$fetched_integrity" = "$EXPECTED_INTEGRITY"
          registry="$(npm view "$PACKAGE@$VERSION" --json --cache "$cold/npm-view-cache")"
          test "$(jq -r .dist.integrity <<<"$registry")" = "$EXPECTED_INTEGRITY"
          test -n "$(jq -r '.dist.attestations.provenance.predicateType // empty' <<<"$registry")"
          test "$(npm view "$PACKAGE" dist-tags.next --json --cache "$cold/npm-view-cache" | jq -r '. // empty')" = "$VERSION"

          mkdir -p "$cold/signature"
          printf '{"private":true,"dependencies":{"%s":"%s"}}\n' "$PACKAGE" "$VERSION" > "$cold/signature/package.json"
          npm install --ignore-scripts --cache "$cold/npm-install-cache" --prefix "$cold/signature"
          npm audit signatures --include-attestations --prefix "$cold/signature"
          bun scripts/verify-core-package.ts --tarball "$fetched"

      - name: Verify exact npm provenance identity
        env:
          PACKAGE: ${{ needs.publish.outputs.package }}
          VERSION: ${{ needs.publish.outputs.version }}
          EXPECTED_INTEGRITY: ${{ needs.publish.outputs.integrity }}
          RELEASE_SHA: ${{ needs.classify.outputs.release-sha }}
        run: |
          set -euo pipefail
          test "$PACKAGE" = "@swartzrock/llm-now-core"
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          case "$EXPECTED_INTEGRITY" in sha512-*) ;; *) echo "invalid preserved tarball integrity" >&2; exit 1 ;; esac
          registry="$(npm view "$PACKAGE@$VERSION" --json)"
          test "$(jq -r .name <<<"$registry")" = "$PACKAGE"
          test "$(jq -r .version <<<"$registry")" = "$VERSION"
          test "$(jq -r .dist.integrity <<<"$registry")" = "$EXPECTED_INTEGRITY"
          attestations_url="$(jq -r '.dist.attestations.url // empty' <<<"$registry")"
          case "$attestations_url" in
            https://registry.npmjs.org/-/npm/v1/attestations/*) ;;
            *) echo "invalid npm attestation endpoint" >&2; exit 1 ;;
          esac
          attestations="$(curl --fail --silent --show-error "$attestations_url")"
          predicate="https://slsa.dev/provenance/v1"
          test "$(jq --arg predicate "$predicate" '[.attestations[]? | select(.predicateType == $predicate)] | length' <<<"$attestations")" -eq 1
          payload_type="$(jq -er --arg predicate "$predicate" '.attestations[] | select(.predicateType == $predicate) | .bundle.dsseEnvelope.payloadType' <<<"$attestations")"
          test "$payload_type" = "application/vnd.in-toto+json"
          payload="$(jq -er --arg predicate "$predicate" '.attestations[] | select(.predicateType == $predicate) | .bundle.dsseEnvelope.payload' <<<"$attestations")"
          statement="$(printf '%s' "$payload" | openssl base64 -d -A)"
          expected_sha512="$(printf '%s' "${EXPECTED_INTEGRITY#sha512-}" | openssl base64 -d -A | od -An -vtx1 | tr -d ' \n')"
          test "${#expected_sha512}" -eq 128
          expected_subject="pkg:npm/%40swartzrock/llm-now-core@$VERSION"
          jq -e --arg predicate "$predicate" --arg subject "$expected_subject" --arg sha512 "$expected_sha512" --arg commit "$RELEASE_SHA" '
            ._type == "https://in-toto.io/Statement/v1" and
            .predicateType == $predicate and
            (.subject | length == 1) and
            .subject[0].name == $subject and
            .subject[0].digest.sha512 == $sha512 and
            .predicate.buildDefinition.externalParameters.workflow.repository == "https://github.com/swartzrock/llm-now" and
            .predicate.buildDefinition.externalParameters.workflow.path == ".github/workflows/publish-core.yml" and
            .predicate.buildDefinition.externalParameters.workflow.ref == "refs/heads/main" and
            any(.predicate.buildDefinition.resolvedDependencies[]?;
              .uri == "git+https://github.com/swartzrock/llm-now@refs/heads/main" and
              .digest.gitCommit == $commit)
          ' <<<"$statement" >/dev/null

  promote:
    needs: [classify, artifact, publish, registry-smoke]
    if: always() && needs.classify.outputs.should-release == 'true' && needs.artifact.result == 'success' && (needs.publish.result == 'success' || needs.publish.result == 'failure')
    runs-on: ubuntu-latest
    environment: npm-core-publish
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify npm trusted publishing toolchain
        run: |
          NODE_VERSION="$(node -p 'process.versions.node')" NPM_VERSION="$(npm --version)" node -e '
            const atLeast = (actual, floor) => { const parts = actual.split(".").map(Number); const difference = floor.findIndex((part, index) => parts[index] !== part); return difference === -1 || parts[difference] > floor[difference]; };
            if (!atLeast(process.env.NODE_VERSION, [22, 14, 0])) throw new Error("Node 22.14 or later is required");
            if (!atLeast(process.env.NPM_VERSION, [11, 5, 1])) throw new Error("npm 11.5.1 or later is required");
          '
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: llm-now-core-${{ needs.classify.outputs.release-sha }}
          path: dist/core-package
      - id: registry
        name: Re-verify candidate and registry state
        env:
          EXPECTED_PACKAGE: ${{ needs.classify.outputs.package-name }}
          EXPECTED_VERSION: ${{ needs.classify.outputs.version }}
          EXPECTED_INTEGRITY: ${{ needs.publish.outputs.integrity }}
        run: |
          set -euo pipefail
          (cd dist/core-package && sha256sum -c SHA256SUMS)
          tarball="$(find dist/core-package -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          manifest="$(tar -xOf "$tarball" package/package.json)"
          test "$(jq -r .name <<<"$manifest")" = "$EXPECTED_PACKAGE"
          test "$(jq -r .version <<<"$manifest")" = "$EXPECTED_VERSION"
          local_integrity="sha512-$(openssl dgst -sha512 -binary "$tarball" | openssl base64 -A)"
          if [ -n "$EXPECTED_INTEGRITY" ]; then
            test "$local_integrity" = "$EXPECTED_INTEGRITY"
          fi
          present=false
          for attempt in 1 2 3 4 5; do
            error_file="$(mktemp)"
            if registry="$(npm view "$EXPECTED_PACKAGE@$EXPECTED_VERSION" --json 2>"$error_file")"; then
              test "$(jq -r .name <<<"$registry")" = "$EXPECTED_PACKAGE"
              test "$(jq -r .version <<<"$registry")" = "$EXPECTED_VERSION"
              test "$(jq -r .dist.integrity <<<"$registry")" = "$local_integrity"
              present=true
              echo "present=true" >> "$GITHUB_OUTPUT"
              test -n "$(jq -r '.dist.attestations.provenance.predicateType // empty' <<<"$registry")"
              break
            elif ! grep -q 'E404' "$error_file"; then
              cat "$error_file" >&2
              exit 1
            fi
            sleep 5
          done
          if [ "$present" = "false" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "${{ needs.registry-smoke.result }}" = "success" ]; then
            test "$present" = "true"
            test "$(npm view "$EXPECTED_PACKAGE" dist-tags.next --json | jq -r '. // empty')" = "$EXPECTED_VERSION"
          fi
      - name: Verify exact npm provenance identity
        env:
          PACKAGE: ${{ needs.classify.outputs.package-name }}
          VERSION: ${{ needs.classify.outputs.version }}
          PUBLISHED_INTEGRITY: ${{ needs.publish.outputs.integrity }}
          RELEASE_SHA: ${{ needs.classify.outputs.release-sha }}
        run: |
          set -euo pipefail
          test "$PACKAGE" = "@swartzrock/llm-now-core"
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          tarball="$(find dist/core-package -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          test -n "$tarball"
          EXPECTED_INTEGRITY="sha512-$(openssl dgst -sha512 -binary "$tarball" | openssl base64 -A)"
          if [ -n "$PUBLISHED_INTEGRITY" ]; then
            test "$EXPECTED_INTEGRITY" = "$PUBLISHED_INTEGRITY"
          fi
          registry="$(npm view "$PACKAGE@$VERSION" --json)"
          test "$(jq -r .name <<<"$registry")" = "$PACKAGE"
          test "$(jq -r .version <<<"$registry")" = "$VERSION"
          test "$(jq -r .dist.integrity <<<"$registry")" = "$EXPECTED_INTEGRITY"
          attestations_url="$(jq -r '.dist.attestations.url // empty' <<<"$registry")"
          case "$attestations_url" in
            https://registry.npmjs.org/-/npm/v1/attestations/*) ;;
            *) echo "invalid npm attestation endpoint" >&2; exit 1 ;;
          esac
          attestations="$(curl --fail --silent --show-error "$attestations_url")"
          predicate="https://slsa.dev/provenance/v1"
          test "$(jq --arg predicate "$predicate" '[.attestations[]? | select(.predicateType == $predicate)] | length' <<<"$attestations")" -eq 1
          payload_type="$(jq -er --arg predicate "$predicate" '.attestations[] | select(.predicateType == $predicate) | .bundle.dsseEnvelope.payloadType' <<<"$attestations")"
          test "$payload_type" = "application/vnd.in-toto+json"
          payload="$(jq -er --arg predicate "$predicate" '.attestations[] | select(.predicateType == $predicate) | .bundle.dsseEnvelope.payload' <<<"$attestations")"
          statement="$(printf '%s' "$payload" | openssl base64 -d -A)"
          expected_sha512="$(printf '%s' "${EXPECTED_INTEGRITY#sha512-}" | openssl base64 -d -A | od -An -vtx1 | tr -d ' \n')"
          test "${#expected_sha512}" -eq 128
          expected_subject="pkg:npm/%40swartzrock/llm-now-core@$VERSION"
          jq -e --arg predicate "$predicate" --arg subject "$expected_subject" --arg sha512 "$expected_sha512" --arg commit "$RELEASE_SHA" '
            ._type == "https://in-toto.io/Statement/v1" and
            .predicateType == $predicate and
            (.subject | length == 1) and
            .subject[0].name == $subject and
            .subject[0].digest.sha512 == $sha512 and
            .predicate.buildDefinition.externalParameters.workflow.repository == "https://github.com/swartzrock/llm-now" and
            .predicate.buildDefinition.externalParameters.workflow.path == ".github/workflows/publish-core.yml" and
            .predicate.buildDefinition.externalParameters.workflow.ref == "refs/heads/main" and
            any(.predicate.buildDefinition.resolvedDependencies[]?;
              .uri == "git+https://github.com/swartzrock/llm-now@refs/heads/main" and
              .digest.gitCommit == $commit)
          ' <<<"$statement" >/dev/null
      - name: Contain a failed new candidate
        if: always() && needs.registry-smoke.result != 'success' && needs.publish.outputs.new-candidate == 'true' && steps.registry.outputs.present == 'true'
        env:
          PACKAGE: ${{ needs.classify.outputs.package-name }}
          VERSION: ${{ needs.classify.outputs.version }}
          NPM_DIST_TAG_TOKEN: ${{ secrets.NPM_DIST_TAG_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$NPM_DIST_TAG_TOKEN" || { echo "candidate containment authority is absent" >&2; exit 1; }
          next="$(npm view "$PACKAGE" dist-tags.next --json | jq -r '. // empty')"
          if [ "$next" = "$VERSION" ]; then
            NODE_AUTH_TOKEN="$NPM_DIST_TAG_TOKEN" npm dist-tag rm "$PACKAGE" next
          fi
          NODE_AUTH_TOKEN="$NPM_DIST_TAG_TOKEN" npm deprecate "$PACKAGE@$VERSION" "Registry verification failed; fix-forward only to a later version."
          echo "Candidate contained; fix-forward only. Do not reuse the immutable version." >&2
      - name: Stop after registry verification failure
        if: always() && needs.registry-smoke.result != 'success'
        run: |
          echo "cold-cache registry verification failed; latest promotion is blocked" >&2
          exit 1
      - name: Promote the verified version to latest
        if: needs.registry-smoke.result == 'success'
        env:
          PACKAGE: ${{ needs.classify.outputs.package-name }}
          VERSION: ${{ needs.classify.outputs.version }}
          NPM_DIST_TAG_TOKEN: ${{ secrets.NPM_DIST_TAG_TOKEN }}
        run: |
          set -euo pipefail
          current="$(npm view "$PACKAGE" dist-tags.latest --json | jq -r '. // empty')"
          if [ "$current" = "$VERSION" ]; then
            exit 0
          fi
          test -n "$NPM_DIST_TAG_TOKEN" || { echo "latest promotion authority is absent" >&2; exit 1; }
          NODE_AUTH_TOKEN="$NPM_DIST_TAG_TOKEN" npm dist-tag add "$PACKAGE@$VERSION" latest
