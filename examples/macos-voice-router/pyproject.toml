[project]
name = "llm-now-voice"
version = "0.1.0"
description = "Route macOS Dictation transcripts to llm-now aliases"
requires-python = ">=3.11"
dependencies = [
  "rapidfuzz>=3.14,<4",
]

[project.scripts]
llm-now-voice = "llm_now_voice.cli:main"

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"
